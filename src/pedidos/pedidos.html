<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Pedidos</title>
    <link rel="stylesheet" href="pedidos.css">
</head>
<body>

    <div class="contenedor">
        <h1>Gestión de Pedidos</h1>

        <form id="pedidoForm">
            <label for="cliente">Cliente:</label>
            <input type="text" id="cliente" required>

            <label for="producto">Producto:</label>
            <input type="text" id="producto" required>

            <label for="cantidad">Cantidad:</label>
            <input type="number" id="cantidad" min="1" required>

            <button type="submit" id="btnPedido">Registrar Pedido</button>
        </form>

        <h2>Pedidos registrados</h2>

        <div class="busqueda">
            <label for="buscarPedido">Buscar pedido:</label>
            <input type="text" id="buscarPedido" placeholder="Buscar por cliente o producto">
        </div>

        <table>
            <thead>
                <tr>
                    <th>Cliente</th>
                    <th>Producto</th>
                    <th>Cantidad</th>
                    <th>Fecha</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="listaPedidos">
            </tbody>
        </table>
    </div>

    <script src="pedidos.js"></script>
</body>
</html>
