<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Pedidos</title>
    <link rel="stylesheet" href="pedidos.css">
</head>
<body>

    <div class="contenedor">

        <header class="encabezado">
            <div>
                <h1>Gestión de Pedidos</h1>
                <p>Administra, consulta y controla los pedidos registrados.</p>
            </div>
        </header>

        <section class="seccion-formulario">

            <h2>Registrar pedido</h2>

            <form id="formPedido">

                <div class="campo">
                    <label for="cliente">Cliente</label>
                    <input
                        type="text"
                        id="cliente"
                        placeholder="Ingrese el cliente"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="producto">Producto</label>
                    <input
                        type="text"
                        id="producto"
                        placeholder="Ingrese el producto"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="cantidad">Cantidad</label>
                    <input
                        type="number"
                        id="cantidad"
                        placeholder="0"
                        min="1"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="estado">Estado</label>
                    <select id="estado" required>
                        <option value="">Seleccione</option>
                        <option value="Pendiente">Pendiente</option>
                        <option value="En proceso">En proceso</option>
                        <option value="Entregado">Entregado</option>
                        <option value="Cancelado">Cancelado</option>
                    </select>
                </div>

                <button type="submit" id="btnPedido" class="btn-principal">
                    + Registrar Pedido
                </button>

            </form>

        </section>

        <section class="seccion-lista">

            <div class="titulo-lista">
                <div>
                    <h2>Lista de Pedidos</h2>
                    <p>Consulta, edita o elimina los pedidos registrados.</p>
                </div>
            </div>

            <div class="buscador-pedidos">
                <span>🔎</span>
                <input
                    type="text"
                    id="buscarPedido"
                    placeholder="Buscar por cliente, producto o estado..."
                >
            </div>

            <div class="tabla-contenedor">

                <table>

                    <thead>
                        <tr>
                            <th>Cliente</th>
                            <th>Producto</th>
                            <th>Cantidad</th>
                            <th>Estado</th>
                            <th>Fecha</th>
                            <th>Hora</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>

                    <tbody id="listaPedidos">
                    </tbody>

                </table>

            </div>

        </section>

    </div>

    <script src="pedidos.js"></script>

</body>
</html>
